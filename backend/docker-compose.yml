# Postgres local para desarrollo (specs/00 §4: no se crea otro proyecto de Supabase).
# Se usan las mismas migraciones que en Supabase: go run ./cmd/migrate
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deepflow
      POSTGRES_PASSWORD: deepflow
      POSTGRES_DB: deepflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepflow -d deepflow"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
