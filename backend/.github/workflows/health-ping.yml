# Supabase pausa el proyecto tras 7 días sin peticiones a la base. Este cron llama
# a GET /v1/health (que ejecuta una consulta) cada 2 días (specs/00 §4).
#
# Ojo: GitHub desactiva los cron en repos con 60 días sin actividad; revisar de vez en cuando.
# Configurar el secreto API_URL (p. ej. https://api.ejemplo.run.app) en el repo.
name: Health ping

on:
  schedule:
    - cron: "0 13 */2 * *" # 8:00 en Bogotá
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /v1/health
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::El secreto API_URL no está configurado; no se hizo el ping."
            exit 0
          fi
          # Reintentos con espera: la API puede tardar en despertar.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "$API_URL/v1/health"
